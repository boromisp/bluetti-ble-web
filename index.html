<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bluetti BLE Monitor</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --fg:#1b1b1a; --mute:#6b6b66; --line:#e2e2dc; --acc:#1f6feb; --on:#1a7f37; --off:#9a9a94; --err:#c62828; --tx:#8250df; --rx:#0a7d6a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --card:#1e1e1c; --fg:#ecece8; --mute:#9b9b95; --line:#2f2f2c; --acc:#4c8dff; --on:#3fb950; --off:#6b6b66; --err:#ff6b6b; --tx:#c297ff; --rx:#4fd1b5; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:560px; margin:0 auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:18px; margin:4px 0 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); min-height:44px; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  button:disabled { opacity:.45; }
  .grow { flex:1; }
  .muted { color:var(--mute); font-size:13px; }
  .notice { color:var(--err); font-size:13px; }
  .meta { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:13px; }
  .meta b { font-weight:500; color:var(--mute); }
  .soc { display:flex; align-items:baseline; gap:8px; }
  .soc .v { font-size:40px; font-weight:700; font-variant-numeric:tabular-nums; }
  .bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:6px; }
  .bar > i { display:block; height:100%; width:0; background:var(--on); transition:width .3s; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .tile { border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .tile .k { font-size:12px; color:var(--mute); }
  .tile .v { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
  .sw { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .sw span { white-space:nowrap; }
  .sw button { min-width:88px; font-weight:600; }
  .sw button.on { background:var(--on); border-color:var(--on); color:#fff; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  #log { height:300px; overflow:auto; font:11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space:pre-wrap; word-break:break-all; background:var(--bg); border-radius:8px; padding:6px; margin-top:8px; }
  #log .tx { color:var(--tx); } #log .rx { color:var(--rx); } #log .err { color:var(--err); } #log .st { color:var(--mute); }
  label.chk { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--mute); }
</style>
</head>
<body>
<main>
  <h1>Bluetti BLE Monitor <span class="muted">proof of concept</span></h1>

  <div class="card">
    <div class="row">
      <button id="connect" class="primary grow">Connect</button>
      <button id="disconnect" disabled>Disconnect</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="chk"><input type="checkbox" id="allDevices"> show all BLE devices</label>
    </div>
    <div id="notice" class="notice" style="margin-top:8px"></div>
    <div class="meta" style="margin-top:8px">
      <b>Device</b><span id="mDevice">–</span>
      <b>Model</b><span id="mModel">–</span>
      <b>Link</b><span id="mLink">disconnected</span>
      <b>Handshake</b><span id="mHs">–</span>
    </div>
  </div>

  <div class="card">
    <div class="soc"><span class="v" id="soc">–</span><span class="muted">% battery</span></div>
    <div class="bar"><i id="socBar"></i></div>
    <div class="grid">
      <div class="tile"><div class="k">AC input</div><div class="v" id="acIn">–</div></div>
      <div class="tile"><div class="k">DC input</div><div class="v" id="dcIn">–</div></div>
      <div class="tile"><div class="k">AC output</div><div class="v" id="acOut">–</div></div>
      <div class="tile"><div class="k">DC output</div><div class="v" id="dcOut">–</div></div>
    </div>
    <div class="grid">
      <div class="tile sw"><span>AC out</span><button id="acBtn" disabled>–</button></div>
      <div class="tile sw"><span>DC out</span><button id="dcBtn" disabled>–</button></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="refresh" class="grow" disabled>Refresh</button>
      <label class="chk"><input type="checkbox" id="auto"> auto 5 s</label>
    </div>
    <div class="muted" id="updated" style="margin-top:6px"></div>
  </div>

  <div class="card">
    <div class="row">
      <strong class="grow">Debug log</strong>
      <label class="chk"><input type="checkbox" id="follow" checked> follow</label>
      <button id="copyLog">Copy</button>
      <button id="clearLog">Clear</button>
    </div>
    <div id="log"></div>
  </div>
</main>

      try {

          const mySig = new Uint8Array(await subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, l1, concat(myPub, this.unsecureIv)));
          const msg = kexFrame(concat(Uint8Array.of(5, 0x80), myPub, mySig));

<script>

  async function detectModel() {
    let name = await tryType(110, true), src = 'register 110 (IoT v2)';
    if (!name) { name = await tryType(10, false); src = 'register 10 (IoT v1)'; }
    if (!name) { name = BT.modelFromName(device.name); src = 'BLE name'; }
    model = name && BT.MODELS[name];
    if (!model) { $('mModel').textContent = 'unknown'; throw new Error('Could not detect a supported model'); }
    $('mModel').textContent = `${name} · IoT v${model.v} · via ${src}`;
    log('st', `model ${name} (v${model.v}) via ${src}; poll ranges ${JSON.stringify(BT.pollRanges(model))}`);
  }

  // ---------- refresh / control ----------
  async function refresh() {
    if (!session || !model || busy) return;
    busy = true; renderStatus();
    try {
      const words = new Map();
      for (const r of BT.pollRanges(model)) {
        const d = await session.readRegs(r.start, r.qty);
        for (let i = 0; i < r.qty; i++) words.set(r.start + i, (d[2 * i] << 8) | d[2 * i + 1]);
      }
      status = BT.parseStatus(model, words);
      log('st', 'status ' + JSON.stringify(status));
      $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (e) { log('err', 'refresh: ' + e.message); $('updated').textContent = 'Refresh failed: ' + e.message; }
    finally { busy = false; renderStatus(); }
  }
  $('refresh').onclick = refresh;

  async function toggle(which) {
    const addr = which === 'ac' ? model.ctrlAc : model.ctrlDc;
    const cur = which === 'ac' ? status.acOn : status.dcOn;
    if (addr == null || cur == null || busy) return;
    busy = true; renderStatus();
    try {
      log('st', `set ${which.toUpperCase()} output ${cur ? 'OFF' : 'ON'} (register ${addr} = ${cur ? 0 : 1})`);
      await session.writeReg(addr, cur ? 0 : 1);
    } catch (e) { log('err', 'write: ' + e.message); $('updated').textContent = 'Write failed: ' + e.message; }
    finally { busy = false; }
    await new Promise((r) => setTimeout(r, 500));
    await refresh();
  }
  $('acBtn').onclick = () => toggle('ac');
  $('dcBtn').onclick = () => toggle('dc');

  function stopAuto() { clearInterval(timer); timer = null; $('auto').checked = false; }
  $('auto').onchange = () => { clearInterval(timer); timer = $('auto').checked ? setInterval(refresh, 5000) : null; };

  renderStatus();
})();
</script>
</body>
