<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bluetti BLE Monitor</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --fg:#1b1b1a; --mute:#6b6b66; --line:#e2e2dc; --acc:#1f6feb; --on:#1a7f37; --off:#9a9a94; --err:#c62828; --tx:#8250df; --rx:#0a7d6a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --card:#1e1e1c; --fg:#ecece8; --mute:#9b9b95; --line:#2f2f2c; --acc:#4c8dff; --on:#3fb950; --off:#6b6b66; --err:#ff6b6b; --tx:#c297ff; --rx:#4fd1b5; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:560px; margin:0 auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:18px; margin:4px 0 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); min-height:44px; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  button:disabled { opacity:.45; }
  .grow { flex:1; }
  .muted { color:var(--mute); font-size:13px; }
  .notice { color:var(--err); font-size:13px; }
  .meta { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:13px; }
  .meta b { font-weight:500; color:var(--mute); }
  .soc { display:flex; align-items:baseline; gap:8px; }
  .soc .v { font-size:40px; font-weight:700; font-variant-numeric:tabular-nums; }
  .bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:6px; }
  .bar > i { display:block; height:100%; width:0; background:var(--on); transition:width .3s; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .tile { border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .tile .k { font-size:12px; color:var(--mute); }
  .tile .v { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
  .sw { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .sw span { white-space:nowrap; }
  .sw button { min-width:88px; font-weight:600; }
  .sw button.on { background:var(--on); border-color:var(--on); color:#fff; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  #log { height:300px; overflow:auto; font:11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space:pre-wrap; word-break:break-all; background:var(--bg); border-radius:8px; padding:6px; margin-top:8px; }
  #log .tx { color:var(--tx); } #log .rx { color:var(--rx); } #log .err { color:var(--err); } #log .st { color:var(--mute); }
  label.chk { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--mute); }
</style>
</head>
<body>
<main>
  <h1>Bluetti BLE Monitor <span class="muted">proof of concept</span></h1>

  <div class="card">
    <div class="row">
      <button id="connect" class="primary grow">Connect</button>
      <button id="disconnect" disabled>Disconnect</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="chk"><input type="checkbox" id="allDevices"> show all BLE devices</label>
    </div>
    <div id="notice" class="notice" style="margin-top:8px"></div>
    <div class="meta" style="margin-top:8px">
      <b>Device</b><span id="mDevice">–</span>
      <b>Model</b><span id="mModel">–</span>
      <b>Link</b><span id="mLink">disconnected</span>
      <b>Handshake</b><span id="mHs">–</span>
    </div>
  </div>

  <div class="card">
    <div class="soc"><span class="v" id="soc">–</span><span class="muted">% battery</span></div>
    <div class="bar"><i id="socBar"></i></div>
    <div class="grid">
      <div class="tile"><div class="k">AC input</div><div class="v" id="acIn">–</div></div>
      <div class="tile"><div class="k">DC input</div><div class="v" id="dcIn">–</div></div>
      <div class="tile"><div class="k">AC output</div><div class="v" id="acOut">–</div></div>
      <div class="tile"><div class="k">DC output</div><div class="v" id="dcOut">–</div></div>
    </div>
    <div class="grid">
      <div class="tile sw"><span>AC out</span><button id="acBtn" disabled>–</button></div>
      <div class="tile sw"><span>DC out</span><button id="dcBtn" disabled>–</button></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="refresh" class="grow" disabled>Refresh</button>
      <label class="chk"><input type="checkbox" id="auto"> auto 5 s</label>
    </div>
    <div class="muted" id="updated" style="margin-top:6px"></div>
  </div>

  <div class="card">
    <div class="row">
      <strong class="grow">Debug log</strong>
      <label class="chk"><input type="checkbox" id="follow" checked> follow</label>
      <button id="copyLog">Copy</button>
      <button id="clearLog">Clear</button>
    </div>
    <div id="log"></div>
  </div>
</main>

<script>/*NOBLE*/</script>
<script>/*PROTO*/</script>
<script>
(() => {
  'use strict';
  const SERVICE = 0xff00;
  const NOTIFY_UUID = '0000ff01-0000-1000-8000-00805f9b34fb';
  const WRITE_UUID = '0000ff02-0000-1000-8000-00805f9b34fb';
  const $ = (id) => document.getElementById(id);

  // ---------- log ----------
  const logEl = $('log'), logLines = [];
  function log(dir, label, u8, extra) {
    const t = new Date().toISOString().slice(11, 23);
    const arrow = dir === 'tx' ? '→' : dir === 'rx' ? '←' : '·';
    const text = `${t} ${arrow} ${label}${u8 ? ` [${u8.length}] ${BT.hex(u8)}` : ''}${extra ? ' ' + extra : ''}`;
    logLines.push(text);
    const div = document.createElement('div');
    div.className = dir; div.textContent = text;
    logEl.appendChild(div);
    while (logEl.childNodes.length > 1500) { logEl.removeChild(logEl.firstChild); logLines.shift(); }
    if ($('follow').checked) logEl.scrollTop = logEl.scrollHeight;
  }
  $('clearLog').onclick = () => { logEl.textContent = ''; logLines.length = 0; };
  $('copyLog').onclick = async () => {
    try { await navigator.clipboard.writeText(logLines.join('\n')); $('copyLog').textContent = 'Copied'; }
    catch { $('copyLog').textContent = 'Copy failed'; }
    setTimeout(() => ($('copyLog').textContent = 'Copy'), 1500);
  };

  // ---------- environment checks ----------
  function envProblem() {
    if (!window.isSecureContext) return 'This page is not a secure context (HTTPS needed for Web Bluetooth).';
    if (!navigator.bluetooth) return 'Web Bluetooth is not available in this browser. Use Chrome on Android (or desktop Chrome).';
    try {
      const fp = document.permissionsPolicy || document.featurePolicy;
      if (window.self !== window.top && fp && fp.allowsFeature && !fp.allowsFeature('bluetooth'))
        return 'This page is embedded in a frame that does not allow Bluetooth. Open it in its own Chrome tab (open the artifact link directly) and try again.';
    } catch {}
    return '';
  }
  const prob = envProblem();
  if (prob) { $('notice').textContent = prob; log('err', prob); }
  else log('st', 'Web Bluetooth available');

  // ---------- state ----------
  let device = null, writeChar = null, notifyChar = null, session = null, model = null, status = null, busy = false, timer = null;
  let gattChain = Promise.resolve();
  const gattWrite = (u8) => { // serialise GATT writes; always with response
    const p = gattChain.then(() => writeChar.writeValueWithResponse(u8));
    gattChain = p.catch(() => {});
    return p;
  };

  function setLink(s) { $('mLink').textContent = s; }
  function renderHs() { $('mHs').innerHTML = session ? `<span class="pill">${session.mode}</span> ${session.hs}` : '–'; }
  const watts = (v) => (v == null ? 'n/a' : v + ' W');
  function renderStatus() {
    const s = status || {};
    $('soc').textContent = s.soc ?? '–';
    $('socBar').style.width = (s.soc ?? 0) + '%';
    for (const k of ['acIn', 'dcIn', 'acOut', 'dcOut']) $(k).textContent = status ? watts(s[k]) : '–';
    for (const [btn, on, ctrl] of [['acBtn', s.acOn, model && model.ctrlAc], ['dcBtn', s.dcOn, model && model.ctrlDc]]) {
      const b = $(btn);
      b.textContent = on == null ? (status ? 'n/a' : '–') : on ? 'ON' : 'OFF';
      b.className = on ? 'on' : '';
      b.disabled = !session || busy || ctrl == null || on == null;
      b.title = ctrl == null ? 'No writable register for this model in bluetti-bt-lib' : '';
    }
    $('refresh').disabled = !session || busy;
  }
  function setConnected(c) {
    $('connect').disabled = c; $('disconnect').disabled = !c;
    if (!c) { session = null; model = null; status = null; stopAuto(); renderHs(); }
    renderStatus();
  }

  // ---------- connect ----------
  $('connect').onclick = async () => {
    $('notice').textContent = '';
    if (!navigator.bluetooth) { $('notice').textContent = envProblem(); return; }
    try {
      const opts = $('allDevices').checked
        ? { acceptAllDevices: true, optionalServices: [SERVICE] }
        : { filters: BT.NAME_PREFIXES.map((namePrefix) => ({ namePrefix })), optionalServices: [SERVICE] };
      log('st', 'requestDevice ' + ($('allDevices').checked ? '(all devices)' : 'prefixes: ' + BT.NAME_PREFIXES.join(',')));
      device = await navigator.bluetooth.requestDevice(opts);
    } catch (e) { log('err', 'requestDevice: ' + e.message); if (e.name !== 'NotFoundError') $('notice').textContent = e.message; return; }

    $('mDevice').textContent = device.name || device.id;
    device.addEventListener('gattserverdisconnected', onDisconnected);
    $('connect').disabled = true;
    try {
      setLink('connecting…'); log('st', 'GATT connect to ' + (device.name || device.id));
      const server = await device.gatt.connect();
      const svc = await server.getPrimaryService(SERVICE);
      notifyChar = await svc.getCharacteristic(NOTIFY_UUID);
      writeChar = await svc.getCharacteristic(WRITE_UUID);
      session = new BT.Session({ write: gattWrite, log, onState: renderHs });
      notifyChar.addEventListener('characteristicvaluechanged', (ev) => {
        const dv = ev.target.value;
        if (session) session.onNotify(new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength));
      });
      await notifyChar.startNotifications();
      setLink('connected'); log('st', 'notifications started on ff01; waiting for first notification');
      setConnected(true); renderHs();
      await session.start(3000, 20000);
      renderHs();
      await detectModel();
      await refresh();
    } catch (e) {
      log('err', 'connect: ' + e.message); $('notice').textContent = e.message;
      if (device && device.gatt.connected) device.gatt.disconnect(); else setConnected(false);
    }
  };

  $('disconnect').onclick = () => { if (device && device.gatt.connected) device.gatt.disconnect(); else onDisconnected(); };
  function onDisconnected() { log('st', 'disconnected'); setLink('disconnected'); setConnected(false); }

  // ---------- model detection ----------
  async function tryType(addr, swap) {
    try {
      const t = BT.decodeType(await session.readRegs(addr, 6), swap);
      log('st', `type register ${addr}: "${t}"`);
      return t && BT.DEVICE_NAME_RE.test(t + '12345678') ? BT.modelFromName(t + '12345678') : null;
    } catch (e) { log('st', `type register ${addr}: ${e.message}`); return null; }
  }
  async function detectModel() {
    let name = await tryType(110, true), src = 'register 110 (IoT v2)';
    if (!name) { name = await tryType(10, false); src = 'register 10 (IoT v1)'; }
    if (!name) { name = BT.modelFromName(device.name); src = 'BLE name'; }
    model = name && BT.MODELS[name];
    if (!model) { $('mModel').textContent = 'unknown'; throw new Error('Could not detect a supported model'); }
    $('mModel').textContent = `${name} · IoT v${model.v} · via ${src}`;
    log('st', `model ${name} (v${model.v}) via ${src}; poll ranges ${JSON.stringify(BT.pollRanges(model))}`);
  }

  // ---------- refresh / control ----------
  async function refresh() {
    if (!session || !model || busy) return;
    busy = true; renderStatus();
    try {
      const words = new Map();
      for (const r of BT.pollRanges(model)) {
        const d = await session.readRegs(r.start, r.qty);
        for (let i = 0; i < r.qty; i++) words.set(r.start + i, (d[2 * i] << 8) | d[2 * i + 1]);
      }
      status = BT.parseStatus(model, words);
      log('st', 'status ' + JSON.stringify(status));
      $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (e) { log('err', 'refresh: ' + e.message); $('updated').textContent = 'Refresh failed: ' + e.message; }
    finally { busy = false; renderStatus(); }
  }
  $('refresh').onclick = refresh;

  async function toggle(which) {
    const addr = which === 'ac' ? model.ctrlAc : model.ctrlDc;
    const cur = which === 'ac' ? status.acOn : status.dcOn;
    if (addr == null || cur == null || busy) return;
    busy = true; renderStatus();
    try {
      log('st', `set ${which.toUpperCase()} output ${cur ? 'OFF' : 'ON'} (register ${addr} = ${cur ? 0 : 1})`);
      await session.writeReg(addr, cur ? 0 : 1);
    } catch (e) { log('err', 'write: ' + e.message); $('updated').textContent = 'Write failed: ' + e.message; }
    finally { busy = false; }
    await new Promise((r) => setTimeout(r, 500));
    await refresh();
  }
  $('acBtn').onclick = () => toggle('ac');
  $('dcBtn').onclick = () => toggle('dc');

  function stopAuto() { clearInterval(timer); timer = null; $('auto').checked = false; }
  $('auto').onchange = () => { clearInterval(timer); timer = $('auto').checked ? setInterval(refresh, 5000) : null; };

  renderStatus();
})();
</script>
</body>
</html>
